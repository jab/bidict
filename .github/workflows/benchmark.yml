name: benchmark

"on":
  push:
    branches:
      - main
      - dev
      - deps
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: (optional) ref to benchmark

# A push to a pull request supersedes any run still in progress for an earlier push, so cancel
# that run rather than make the new one wait for it. Each run for any other event gets a group
# of its own, so always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PYTHONHASHSEED: "42"
  BASELINE_RELEASE_TAG: microbenchmarks
  # Callgrind counts instructions rather than measuring time, so comparing them is
  # reproducible and can be held to a tight bound. A change of more than these in either
  # direction is called out, whether in the total of the benchmarks' counts or in any one
  # benchmark's. Repeated runs of one revision give identical counts, but a change elsewhere
  # in the code, even to a docstring, or a run from another workflow, as the baselines' is,
  # shifts the process's memory layout, which has been seen to move individual benchmarks by
  # up to 1.4% and their total by up to 0.14%. Hence the looser bound for the individual
  # benchmarks.
  #
  # Wall-clock timings are deliberately not compared at all. The timings pytest-benchmark
  # reports here are measured *under* Callgrind, and vary far more between runs of identical
  # code than any change worth catching: revisions whose bidict/ was byte-identical have been
  # seen to differ by tens of percent, in both directions.
  TOTAL_INSTRUCTION_CHANGE_PCT: "1.0"
  BENCHMARK_INSTRUCTION_CHANGE_PCT: "3.0"

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: install valgrind
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: valgrind
      - name: check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: resolve benchmark metadata
        id: metadata
        run: |
          mapfile -t python_info < <(nix develop .#benchmark --command bash -c "python - <<'PY'
          import platform
          print(platform.python_version())
          print(platform.python_implementation())
          PY")
          python_version=${python_info[0]}
          python_impl=${python_info[1]}
          python_series=${python_version%.*}
          arch=$(uname -m)
          instr_asset_name="GHA-linux-callgrind-${arch}-${python_impl}-${python_series}-instructions.json"
          instr_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${BASELINE_RELEASE_TAG}/${instr_asset_name}"
          {
            echo "python_version=$python_version"
            echo "python_series=$python_series"
            echo "instr_asset_name=$instr_asset_name"
            echo "instr_url=$instr_url"
          } >> "$GITHUB_OUTPUT"
      - name: benchmark
        id: benchmark
        run: |
          set +e
          nix develop .#benchmark --command bash -c '
            set -euo pipefail
            git checkout ${{ github.event.inputs.ref || github.sha }}
            # install a non-editable version of bidict at the revision under test
            uv pip install --python "$VIRTUAL_ENV/bin/python" --no-deps .
            # restore the current revision so we use its version of tests/microbenchmarks.py
            git checkout ${{ github.sha }}
            # move aside the '"'"'bidict'"'"' subdirectory to make sure we always import the installed version
            mv -v bidict src
            ./callgrind.py --json instructions.json \
              pytest -c /dev/null -n0 -p callgrind --benchmark-timer=callgrind.timer \
                --benchmark-autosave \
                --benchmark-columns=min,rounds,iterations \
                --benchmark-disable-gc \
                --benchmark-group-by=name \
                microbenchmarks.py
          ' 2>&1 | tee benchmark-output.txt
          benchmark_status=${PIPESTATUS[0]}
          # Nothing here is allowed to fail the job except the run itself failing, which
          # means pytest could not benchmark the revision at all.
          if [ "$benchmark_status" -eq 0 ]; then
            result_state=ok
            result_message='benchmarks ran'
          else
            result_state=failed
            result_message='benchmark execution failed'
          fi
          {
            echo "exit_code=$benchmark_status"
            echo "result_state=$result_state"
            echo "result_message=$result_message"
          } >> "$GITHUB_OUTPUT"
          exit "$benchmark_status"
      - name: compare instruction counts to baseline
        id: instructions
        if: always()
        env:
          INSTR_URL: ${{ steps.metadata.outputs.instr_url }}
        run: |
          if [ ! -s instructions.json ]; then
            # Distinct from a missing baseline: this means callgrind.py did not honor --json,
            # i.e. something here is broken rather than unpublished.
            echo 'state=unavailable' >> "$GITHUB_OUTPUT"
            echo 'summary=callgrind.py recorded no instruction counts' >> "$GITHUB_OUTPUT"
          elif ! curl -fL -s -o instructions-baseline.json "$INSTR_URL" || [ ! -s instructions-baseline.json ]; then
            echo 'state=unavailable' >> "$GITHUB_OUTPUT"
            echo "summary=no instruction baseline published yet (${INSTR_URL##*/})" >> "$GITHUB_OUTPUT"
          else
            ./compare_instructions.py instructions-baseline.json instructions.json \
                --threshold "$BENCHMARK_INSTRUCTION_CHANGE_PCT" \
                --total-threshold "$TOTAL_INSTRUCTION_CHANGE_PCT" \
                --github-output "$GITHUB_OUTPUT" \
                > instructions-report.md
          fi
      # Only on pull requests: on a push the baseline is whatever was last published, so drift
      # since then is expected rather than notable.
      - name: warn of instruction count regressions
        if: always() && github.event_name == 'pull_request' && steps.instructions.outputs.state == 'regression'
        env:
          INSTR_SUMMARY: ${{ steps.instructions.outputs.summary }}
        run: |
          echo "::warning::Instruction count: ${INSTR_SUMMARY}."

      - name: summarize benchmark result
        if: always()
        run: |
          {
            echo '## Benchmark result'
            echo
            echo "- Baseline asset: \`${{ steps.metadata.outputs.instr_asset_name }}\`"
            echo "- Benchmark run: [${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Instruction thresholds: \`${BENCHMARK_INSTRUCTION_CHANGE_PCT}%\` per benchmark, \`${TOTAL_INSTRUCTION_CHANGE_PCT}%\` for the total"
            echo "- Result: ${{ steps.benchmark.outputs.result_message }}"
            echo "- Instruction count: ${{ steps.instructions.outputs.summary }}"
            if [ -s instructions-report.md ]; then
              echo
              cat instructions-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: prepare PR benchmark comment
        if: always() && github.event_name == 'pull_request'
        env:
          BASELINE_ASSET_NAME: ${{ steps.metadata.outputs.instr_asset_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT_MESSAGE: ${{ steps.benchmark.outputs.result_message }}
          RESULT_STATE: ${{ steps.benchmark.outputs.result_state }}
          INSTR_STATE: ${{ steps.instructions.outputs.state }}
          INSTR_SUMMARY: ${{ steps.instructions.outputs.summary }}
        run: |
          mkdir -p benchmark-pr-comment
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "$INSTR_STATE" in
            improved)   emoji=:zap: ;;
            regression) emoji=:warning: ;;
            ok)         emoji=:white_check_mark: ;;
            *)          emoji=:grey_question: ;;
          esac
          headline="${emoji} Instruction count: ${INSTR_SUMMARY}."
          report=
          if [ "$RESULT_STATE" != ok ]; then
            headline=":x: Benchmark execution failed, so there is nothing to compare."
          elif [ -s instructions-report.md ]; then
            report=$(cat instructions-report.md)
          fi
          cat > benchmark-pr-comment/comment.md <<EOF
          <!-- bidict-benchmark-comment -->
          ## Benchmark report

          ${headline}

          ${report}

          - Baseline asset: \`${BASELINE_ASSET_NAME}\`
          - Instruction thresholds: \`${BENCHMARK_INSTRUCTION_CHANGE_PCT}%\` per benchmark, \`${TOTAL_INSTRUCTION_CHANGE_PCT}%\` for the total
          - Run: [benchmark workflow run](${run_url})

          _Instruction counts are reported for information and do not block merging. Each counts
          only the benchmark's timed calls. Wall-clock timings are not compared: measured under
          Callgrind, they vary too much between runs._
          EOF
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'pr_number': os.environ['PR_NUMBER'],
              'result_state': os.environ['RESULT_STATE'],
              'result_message': os.environ['RESULT_MESSAGE'],
              'baseline_asset_name': os.environ['BASELINE_ASSET_NAME'],
              'benchmark_instruction_threshold_pct': os.environ['BENCHMARK_INSTRUCTION_CHANGE_PCT'],
              'total_instruction_threshold_pct': os.environ['TOTAL_INSTRUCTION_CHANGE_PCT'],
              'instruction_state': os.environ['INSTR_STATE'],
              'instruction_summary': os.environ['INSTR_SUMMARY'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path('benchmark-pr-comment/result.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: archive PR benchmark comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-pr-comment
          path: benchmark-pr-comment
          if-no-files-found: error
      - name: archive benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: microbenchmark results (CPython ${{ steps.metadata.outputs.python_version }})
          path: |
            .benchmarks
            benchmark-output.txt
            instructions.json
            instructions-report.md
          include-hidden-files: true
          if-no-files-found: error

permissions:
  contents: read
